name: Release

on:
    push:
        branches:
            - main
    # Publish a release that exists but never reached npm (a failed publish cannot be retried by re-running
    # the job: the release flag only exists in the run that created the release). Run it from `main` and
    # give it the tag, e.g. v3.0.0. It lives in this file because npm's Trusted Publisher names the workflow.
    workflow_dispatch:
        inputs:
            ref:
                description: Tag to publish, e.g. v3.0.0
                required: true

permissions:
    contents: write
    id-token: write
    pull-requests: write

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.ref || github.ref }}

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Tests
              run: pnpm test

            - name: Build
              run: pnpm run build

            - name: Semantic Release
              if: github.event_name == 'push'
              run: npx semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: "00000000-0000-0000-0000-000000000000"

            # Trusted publishing (OIDC): no token. The `id-token: write` permission above lets npm
            # prove which workflow is publishing, and the package's Trusted Publisher setting on
            # npmjs.com (repository collidor/ui, workflow publish.yml) accepts it. Do not add
            # `registry-url` to setup-node or a NODE_AUTH_TOKEN: an empty token makes npm stop with
            # ENEEDAUTH instead of using OIDC. No continue-on-error: a failed publish must fail the run.
            - name: Publish to NPM
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    # publish the checked-out tag, unless that version is already on npm
                    if npm view "@collidor/ui@$VERSION" version >/dev/null 2>&1; then
                      echo "@collidor/ui@$VERSION is already on npm, nothing to do."
                    else
                      npm publish --provenance --access public
                    fi
                  elif [ -f .release_flag ]; then
                    npm publish --provenance --access public
                  else
                    echo "No release flag found, skipping publish."
                  fi

            - name: Publish to JSR
              continue-on-error: true
              run: |
                  if [ -f .release_flag ]; then
                    jsr_out=$(deno publish --allow-slow-types --allow-dirty 2>&1) || {
                      echo "::error title=JSR_PUBLISH_ERROR::$(echo "$jsr_out" | tr '\n' ' ')"
                      exit 1
                    }
                  else
                    echo "No release flag found, skipping JSR publish."
                  fi
